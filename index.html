<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reprodutor de Vídeos — Rádio Explosão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .player-aspect-box {
            aspect-ratio: 16 / 8.5;
            width: 100%;
            max-width: 1000px;
            max-height: 92vh;
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
            transition: border-radius 0.3s ease;
        }

        .player-aspect-box:fullscreen,
        .player-aspect-box:-webkit-full-screen {
            max-width: 100vw !important;
            max-height: 100vh !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }

        .cards-scroller::-webkit-scrollbar,
        .modal-scroller::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .cards-scroller::-webkit-scrollbar-track,
        .modal-scroller::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
        }
        .cards-scroller::-webkit-scrollbar-thumb,
        .modal-scroller::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
        }
        .cards-scroller::-webkit-scrollbar-thumb:hover,
        .modal-scroller::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        .modal-scroller {
            max-height: 82vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .ambient-backdrop {
            background: radial-gradient(circle at 50% 42%, rgba(196, 128, 56, 0.52) 0%, rgba(112, 66, 28, 0.32) 34%, rgba(10, 16, 24, 0.96) 72%, #070b10 100%);
        }

        .hud-layer {
            transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1), transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hud-hidden-top {
            opacity: 0 !important;
            transform: translateY(-14px);
            pointer-events: none !important;
        }
        .hud-hidden-bottom {
            opacity: 0 !important;
            transform: translateY(18px);
            pointer-events: none !important;
        }
        .hud-hidden-fade {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-3 sm:p-6 select-none">

    <!-- Container Principal Único: Reprodutor de Vídeos -->
    <div id="mainPlayerContainer" class="player-aspect-box relative overflow-hidden bg-[#070b10] flex flex-col justify-between">
        
        <!-- Camada de Fundo Desfocado -->
        <div id="ambientFallback" class="ambient-backdrop absolute inset-0 z-0 transition-opacity duration-500 flex items-center justify-center">
            <div class="absolute inset-0 backdrop-blur-3xl opacity-90"></div>
            <div id="audioStatusBadge" class="hidden relative z-10 px-5 py-3 rounded-2xl bg-black/55 border border-white/15 backdrop-blur-md text-center max-w-xs">
                <p class="text-[11px] uppercase tracking-widest text-red-400 font-bold mb-1">Transmissão de Áudio</p>
                <p id="audioStatusTitle" class="text-sm font-bold text-white truncate">Rádio Explosão</p>
                <p class="text-xs text-white/65 mt-0.5">A sua música toca aqui!</p>
            </div>
        </div>

        <!-- Camada de Vídeo Nativo / HLS (MP4, WebM, M3U8) -->
        <video id="nativeVideoPlayer" class="hidden absolute inset-0 w-full h-full object-cover z-0 bg-black" autoplay playsinline controls></video>

        <!-- Camada de Rádio / Áudio Nativo -->
        <audio id="radioAudioPlayer" class="hidden" autoplay controls></audio>

        <!-- Camada de Vídeo / Player Externo (YouTube / Web Player / Multi-sistema) -->
        <div id="youtubeContainer" class="hidden absolute inset-0 w-full h-full z-0 bg-black">
            <iframe id="youtubeIframe" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Palco Dedicado Compacto: Transmissão Ao Vivo (Rádio Explosão & TV Online / BGames) -->
        <div id="radioTvStage" class="hidden absolute inset-x-4 top-14 bottom-28 sm:inset-x-7 sm:top-16 sm:bottom-32 z-10 rounded-2xl bg-gradient-to-br from-[#1b090c]/95 via-[#0d1118]/95 to-[#070b10]/95 border border-white/15 backdrop-blur-xl flex items-center justify-center p-3 sm:p-4 shadow-2xl">
            <div class="relative w-full max-w-2xl">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="inline-flex items-center gap-1 bg-[#e11d2b] text-white text-[10px] font-extrabold tracking-wider uppercase px-2 py-0.5 rounded-full">
                            <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                            AO VIVO
                        </span>
                        <span id="radioTvModeBadge" class="text-xs font-semibold text-white/90 truncate">Rádio Explosão &amp; TV Online</span>
                    </div>
                    <button id="reloadLiveStreamBtn" type="button" class="inline-flex items-center gap-1 bg-white/10 hover:bg-white/20 text-white text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-white/10 transition cursor-pointer">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        <span>Reconectar</span>
                    </button>
                </div>

                <!-- Seletor Rápido de Sinal Ao Vivo -->
                <div class="space-y-1.5">
                    <div class="flex flex-wrap items-center gap-1.5">
                        <button type="button" data-source-preset="default" class="live-preset-btn px-2 py-0.5 rounded-md text-[10px] font-semibold bg-white/15 hover:bg-white/25 text-white border border-white/10 transition cursor-pointer">
                            Sinal Padrão
                        </button>
                        <button type="button" data-source-preset="youtube" class="live-preset-btn px-2 py-0.5 rounded-md text-[10px] font-semibold bg-white/10 hover:bg-white/20 text-white/80 border border-white/10 transition cursor-pointer">
                            YouTube Ao Vivo
                        </button>
                        <button type="button" data-source-preset="stream" class="live-preset-btn px-2 py-0.5 rounded-md text-[10px] font-semibold bg-white/10 hover:bg-white/20 text-white/80 border border-white/10 transition cursor-pointer">
                            HLS / URL / Outro
                        </button>
                    </div>
                    <form id="quickLiveSourceForm" class="flex items-center gap-2">
                        <input id="quickLiveUrlInput" type="url" required placeholder="Cole o link do YouTube Ao Vivo, .m3u8 ou player externo" class="flex-1 min-w-0 bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-lg px-2.5 py-1 text-xs text-white placeholder-white/40 transition">
                        <button type="submit" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#e11d2b] hover:bg-[#c81724] text-white transition cursor-pointer flex-shrink-0">
                            Trocar Sinal
                        </button>
                    </form>
                </div>

                <div class="w-full h-20 sm:h-24 mt-2 rounded-xl overflow-hidden bg-black/80 border border-white/10 flex items-center justify-center relative">
                    <iframe id="radioTvEmbedIframe" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    <div id="liveStageEmptyHint" class="hidden text-center px-3">
                        <p class="text-xs font-semibold text-white/85">Pronto para transmitir</p>
                        <p class="text-[11px] text-white/55">Cole acima um link de YouTube Ao Vivo, .m3u8 ou player externo.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Camada Transparente de Interceptação (Modo Cinema) -->
        <div id="restoreUiOverlay" class="hidden absolute inset-0 z-30 cursor-pointer bg-transparent" title="Toque ou clique para mostrar os controles"></div>

        <!-- Gradientes superior e inferior -->
        <div id="topGradient" class="hud-layer pointer-events-none absolute inset-x-0 top-0 h-20 bg-gradient-to-b from-black/65 via-black/25 to-transparent z-10"></div>
        <div id="bottomGradient" class="hud-layer pointer-events-none absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-black/95 via-black/75 to-transparent z-10"></div>

        <!-- Barra Superior Interna -->
        <div id="topHudBar" class="hud-layer relative z-20 flex-shrink-0 flex items-center justify-between gap-2 px-4 pt-3 sm:px-7 sm:pt-4 min-w-0 w-full">
            <!-- Selo Vermelho VÍDEOS & AO VIVO (Compacto) -->
            <div class="inline-flex items-center gap-1.5 bg-[#e11d2b] text-white font-extrabold tracking-wider text-[10px] sm:text-xs px-2.5 py-1 sm:px-3.5 sm:py-1.5 rounded-xl shadow-lg flex-shrink-0">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-white animate-pulse"></span>
                <span>VÍDEOS &amp; AO VIVO</span>
            </div>

            <!-- Título do Vídeo Atual -->
            <div id="nowPlayingBadge" class="hidden lg:flex items-center gap-2 px-4 py-1.5 rounded-full bg-black/45 backdrop-blur-md border border-white/10 text-white/90 text-xs font-medium max-w-xs truncate">
                <span class="text-white/50">Reproduzindo:</span>
                <span id="nowPlayingTitle" class="truncate font-semibold text-white">Carregando...</span>
            </div>

            <!-- Grupo de Controles Superiores Direitos -->
            <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
                <!-- Botão Resetar Cards Padrão -->
                <button id="resetCardsBtn" type="button" title="Resetar para os cards padrão" aria-label="Resetar para os cards padrão" class="inline-flex items-center gap-1.5 bg-white/15 hover:bg-white/25 active:scale-95 text-white text-xs sm:text-sm font-semibold px-2.5 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    <span class="hidden md:inline">Resetar</span>
                </button>

                <!-- Botão Adicionar Novo Card -->
                <button id="openAddModalBtn" type="button" title="Adicionar novo card de vídeo" class="inline-flex items-center gap-1.5 bg-white/15 hover:bg-white/25 active:scale-95 text-white text-xs sm:text-sm font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="hidden sm:inline">Adicionar Card</span>
                </button>

                <!-- 1) Botão Ocultar Interface -->
                <button id="hideUiBtn" type="button" title="Ocultar interface (Modo Cinema)" aria-label="Ocultar interface" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>

                <!-- 2) Botão Picture-in-Picture (PiP) -->
                <button id="pipBtn" type="button" title="Picture-in-Picture (Janela Flutuante)" aria-label="Picture-in-Picture" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="14" rx="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="11" y="10" width="8" height="6" rx="1.2" fill="currentColor" stroke="none"/>
                    </svg>
                </button>

                <!-- 3) Botão Tela Cheia (Fullscreen) -->
                <button id="fullscreenBtn" type="button" title="Tela Cheia" aria-label="Tela Cheia" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg id="fullscreenExpandIcon" class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                    </svg>
                    <svg id="fullscreenCompressIcon" class="hidden w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Faixa Horizontal de Cards na Parte Inferior Interna -->
        <div id="bottomHudBar" class="hud-layer relative z-20 flex-shrink-0 min-w-0 w-full px-4 pb-3 sm:px-7 sm:pb-4 bg-[#070b10]/90 backdrop-blur-md border-t border-white/10">
            <div id="cardsTrack" class="cards-scroller flex items-center gap-3 sm:gap-4 min-w-0 w-full overflow-x-auto pb-1 pt-1.5">
                <!-- Os cards são renderizados dinamicamente via JavaScript -->
            </div>
        </div>

        <!-- Overlay / Modal Interno Compacto para Adicionar Novo Card (Exige Usuário e Senha do Dono) -->
        <div id="addCardModal" class="hidden absolute inset-0 z-40 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 transition-opacity overflow-y-auto">
            <div id="addCardModalBox" class="modal-scroller w-full max-w-md bg-[#121721]/95 border border-white/15 rounded-3xl p-5 sm:p-6 shadow-2xl text-white my-auto">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base sm:text-lg font-bold tracking-tight">Adicionar Novo Card</h2>
                    <button id="closeAddModalBtn" type="button" class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition cursor-pointer" title="Fechar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="addCardForm" class="space-y-3">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="ownerUserInput" class="block text-xs font-semibold text-white/75 mb-1">Usuário do Dono</label>
                            <input id="ownerUserInput" type="text" required autocomplete="username" placeholder="Usuário" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                        </div>
                        <div>
                            <label for="ownerPassInput" class="block text-xs font-semibold text-white/75 mb-1">Senha do Dono</label>
                            <input id="ownerPassInput" type="password" required autocomplete="current-password" placeholder="Senha" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                        </div>
                    </div>

                    <div>
                        <label for="cardTitleInput" class="block text-xs font-semibold text-white/75 mb-1">Título do Canal ou Vídeo</label>
                        <input id="cardTitleInput" type="text" required placeholder="Ex: Canal Ao Vivo HD" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <div>
                        <label for="cardUrlInput" class="block text-xs font-semibold text-white/75 mb-1">Link da URL (M3U8, MP4, WebM, Rádio ou YouTube)</label>
                        <input id="cardUrlInput" type="url" required placeholder="https://.../playlist.m3u8 ou YouTube" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <p id="formErrorMsg" class="hidden text-xs text-red-400 font-medium"></p>

                    <div class="flex items-center justify-end gap-2.5 pt-2">
                        <button type="button" id="cancelAddModalBtn" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white/10 hover:bg-white/20 text-white/85 transition cursor-pointer">
                            Cancelar
                        </button>
                        <button type="submit" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-[#e11d2b] hover:bg-[#c81724] text-white shadow-lg transition cursor-pointer">
                            Salvar Card
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Overlay / Modal Interno para Autenticar Remoção de Card -->
        <div id="removeAuthModal" class="hidden absolute inset-0 z-40 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 transition-opacity overflow-y-auto">
            <div class="modal-scroller w-full max-w-sm bg-[#121721]/95 border border-white/15 rounded-3xl p-5 sm:p-6 shadow-2xl text-white my-auto">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold tracking-tight">Remover Card</h2>
                    <button id="closeRemoveModalBtn" type="button" class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition cursor-pointer" title="Fechar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <p id="removeCardTargetLabel" class="text-xs text-white/70 mb-3.5 truncate"></p>

                <form id="removeCardForm" class="space-y-3">
                    <div>
                        <label for="removeUserInput" class="block text-xs font-semibold text-white/75 mb-1">Usuário do Dono</label>
                        <input id="removeUserInput" type="text" required autocomplete="username" placeholder="Usuário" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <div>
                        <label for="removePassInput" class="block text-xs font-semibold text-white/75 mb-1">Senha do Dono</label>
                        <input id="removePassInput" type="password" required autocomplete="current-password" placeholder="Senha" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <p id="removeErrorMsg" class="hidden text-xs text-red-400 font-medium"></p>

                    <div class="flex items-center justify-end gap-2.5 pt-2">
                        <button type="button" id="cancelRemoveModalBtn" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white/10 hover:bg-white/20 text-white/85 transition cursor-pointer">
                            Cancelar
                        </button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-red-600 hover:bg-red-700 text-white shadow-lg transition cursor-pointer">
                            Confirmar Remoção
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notificação interna discreta -->
        <div id="toastNotification" class="hidden absolute top-16 sm:top-20 left-1/2 -translate-x-1/2 z-50 bg-black/85 border border-white/15 text-white text-xs font-medium px-4 py-2 rounded-full shadow-xl backdrop-blur-md text-center max-w-[90%]"></div>
    </div>

    <script>
        const OWNER_CREDENTIALS = {
            username: 'admin',
            password: '1540'
        };

        const DEFAULT_XCAST_URL = 'https://player.xcast.com.br/player-app-multi-plataforma/11904';
        const DEFAULT_BGAMES_URL = '';
        const STORAGE_KEY = 'live_player_video_cards_v11_bottom_cards_visible';
        const STATE_STORAGE_KEY = 'live_player_state_v8_bottom_cards_visible';

        const RADIO_TV_COVER_SVG = `
            <div class="w-full h-full relative bg-gradient-to-br from-[#7f1d1d] via-[#3b1219] to-[#090e1a] flex flex-col items-center justify-center overflow-hidden">
                <div class="flex items-center gap-2 text-amber-200 drop-shadow-[0_0_8px_rgba(248,113,113,0.55)]">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 14.5a5 5 0 017 0M6 12a8.5 8.5 0 0112 0" />
                        <circle cx="12" cy="17" r="1.5" fill="currentColor" stroke="none" />
                    </svg>

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isSafeHttpUrl(rawUrl) {
            if (!rawUrl || typeof rawUrl !== 'string') return false;
            try {
                const parsed = new URL(rawUrl.trim());
                return parsed.protocol === 'https:' || parsed.protocol === 'http:';
            } catch (_) {
                return false;
            }
        }

        function isLiveHubCard(card) {
            return Boolean(card && (card.id === 'card-2' || card.id === 'card-3' || card.liveHub === true));

        function getCardDefaultUrl(card) {
            if (card && isSafeHttpUrl(card.defaultUrl)) return card.defaultUrl.trim();
            return DEFAULT_XCAST_URL;

                        activeCardId = parsedState.activeCardId;
                    }

        function loadCards() {

                if (saved) {

                    if (Array.isArray(parsed) && parsed.length > 0) {
                        videoCards = parsed
                            .filter(c => c && typeof c.title === 'string')

                                return {
                                    id: String(c.id || ('card-' + Math.random().toString(36).slice(2, 8))),
                                    title: c.title.trim() || 'Sem título',
                                    url: isSafeHttpUrl(c.url) ? c.url.trim() : '',
                                    defaultUrl: isSafeHttpUrl(c.defaultUrl) ? c.defaultUrl.trim() : DEFAULT_XCAST_URL,
                                    liveHub: isHub,
                                    theme: c.theme || (c.id === 'card-3' ? 'games' : (c.id === 'card-2' ? 'radio-tv' : undefined))
                                };
                            });
                        if (videoCards.length > 0) return;
                    }
                }
            } catch (e) {
                console.warn('Falha ao ler localStorage:', e);
            }
            videoCards = defaultCards.map(c => ({ ...c }));
        }

            try {

        function extractYouTubeId(url) {
            if (!isSafeHttpUrl(url)) return null;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        function isHlsStream(url) {
            if (!isSafeHttpUrl(url)) return false;
            return /\.m3u8(\?.*)?$/i.test(url.trim());
        }

        function isDirectAudioStream(url) {
            if (!isSafeHttpUrl(url)) return false;
            return /\.(mp3|aac|ogg|opus|wav)(\?.*)?$/i.test(url.trim());
        }

        function isDirectVideoStream(url) {
            if (!isSafeHttpUrl(url)) return false;
            return /\.(mp4|webm|ogv|mov)(\?.*)?$/i.test(url.trim());
        }

        function attemptAutoplay(mediaEl, labelForToast = 'reprodução') {
            mediaEl.muted = false;
            const playPromise = mediaEl.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    mediaEl.muted = true;
                    mediaEl.play().then(() => {
                        showToast(`Autoplay sem áudio (toque para ativar o som da ${labelForToast}).`);
                    }).catch(() => {
                        showToast(`Toque para iniciar a ${labelForToast}.`);
                    });
                });
            }
        }

        async function togglePictureInPicture() {
            const isNativeVideoVisible = !nativeVideoPlayer.classList.contains('hidden');
            const isYouTubeVisible = !youtubeContainer.classList.contains('hidden');
            const isLiveStageVisible = !radioTvStage.classList.contains('hidden');

            if (isYouTubeVisible || isLiveStageVisible) {
                showToast('O Picture-in-Picture está disponível para transmissões ao vivo (M3U8) e vídeos MP4.');
                return;
            }

            if (!isNativeVideoVisible || (!nativeVideoPlayer.src && !hlsInstance)) {
                showToast('Inicie uma transmissão ou vídeo para ativar o Picture-in-Picture.');
                return;
            }

            if (!document.pictureInPictureEnabled && !nativeVideoPlayer.webkitSetPresentationMode) {
                showToast('Seu navegador não suporta Picture-in-Picture.');
                return;
            }

            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (nativeVideoPlayer.requestPictureInPicture) {
                    await nativeVideoPlayer.requestPictureInPicture();
                } else if (nativeVideoPlayer.webkitSetPresentationMode) {
                    const mode = nativeVideoPlayer.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
                    nativeVideoPlayer.webkitSetPresentationMode(mode);
                }
            } catch (err) {
                console.warn('Erro ao alternar PiP:', err);
                showToast('Dê play no vídeo antes de ativar o Picture-in-Picture.');
            }
        }

        function destroyHls() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        function attachHlsStream(url, videoElement) {
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(videoElement);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    attemptAutoplay(videoElement, 'transmissão ao vivo');
                });

                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showToast('Erro de conexão ou bloqueio CORS no sinal deste canal.');
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                destroyHls();
                                showToast('Sinal indisponível no momento.');
                                break;
                        }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', () => {
                    attemptAutoplay(videoElement, 'transmissão ao vivo');
                }, { once: true });
            } else {
                showToast('Seu navegador não suporta transmissões HLS (.m3u8).');
            }
        }

        function playCard(card) {
            if (!card) return;
            currentPlayingCard = card;
            activeCardId = card.id;
            nowPlayingTitle.textContent = card.title;
            saveState();

            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            }

            destroyHls();
            nativeVideoPlayer.pause();
            nativeVideoPlayer.removeAttribute('src');
            nativeVideoPlayer.load();
            nativeVideoPlayer.classList.add('hidden');

            radioAudioPlayer.pause();
            radioAudioPlayer.removeAttribute('src');
            radioAudioPlayer.load();
            audioStatusBadge.classList.add('hidden');

            youtubeIframe.src = '';
            youtubeContainer.classList.add('hidden');

            radioTvEmbedIframe.src = '';
            radioTvStage.classList.add('hidden');
            liveStageEmptyHint.classList.add('hidden');

            const liveHub = isLiveHubCard(card);
            const hasValidUrl = Boolean(card.url && isSafeHttpUrl(card.url));

            if (liveHub) {
                ambientFallback.classList.add('opacity-0');
                radioTvStage.classList.remove('hidden');
                radioTvModeBadge.textContent = card.title;
                quickLiveUrlInput.value = hasValidUrl ? card.url : '';

                if (!hasValidUrl) {
                    liveStageEmptyHint.classList.remove('hidden');
                    renderCards();
                    return;
                }

                const ytId = extractYouTubeId(card.url);
                if (ytId) {
                    radioTvEmbedIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
                } else if (isHlsStream(card.url) || isDirectVideoStream(card.url) || isDirectAudioStream(card.url)) {
                    radioTvStage.classList.add('hidden');
                    if (isDirectAudioStream(card.url)) {
                        ambientFallback.classList.remove('opacity-0');
                        audioStatusTitle.textContent = card.title;
                        audioStatusBadge.classList.remove('hidden');
                        radioAudioPlayer.src = card.url;
                        attemptAutoplay(radioAudioPlayer, card.title);
                    } else {
                        nativeVideoPlayer.classList.remove('hidden');
                        if (isHlsStream(card.url)) {
                            attachHlsStream(card.url, nativeVideoPlayer);
                        } else {
                            nativeVideoPlayer.src = card.url;
                            attemptAutoplay(nativeVideoPlayer, card.title);
                        }
                    }
                } else {
                    radioTvEmbedIframe.src = card.url;
                }
                renderCards();
                return;
            }

            if (!hasValidUrl) {
                ambientFallback.classList.remove('opacity-0');
                renderCards();
                return;
            }

            const ytId = extractYouTubeId(card.url);
            if (ytId) {
                ambientFallback.classList.add('opacity-0');
                youtubeContainer.classList.remove('hidden');
                youtubeIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
            } else if (isHlsStream(card.url)) {
                ambientFallback.classList.add('opacity-0');
                nativeVideoPlayer.classList.remove('hidden');
                attachHlsStream(card.url, nativeVideoPlayer);
            } else if (isDirectAudioStream(card.url)) {
                ambientFallback.classList.remove('opacity-0');
                audioStatusTitle.textContent = card.title;
                audioStatusBadge.classList.remove('hidden');
                radioAudioPlayer.src = card.url;
                attemptAutoplay(radioAudioPlayer, card.title);
            } else if (isDirectVideoStream(card.url)) {
                ambientFallback.classList.add('opacity-0');
                nativeVideoPlayer.classList.remove('hidden');
                nativeVideoPlayer.src = card.url;
                attemptAutoplay(nativeVideoPlayer, 'reprodução');
            } else {
                ambientFallback.classList.add('opacity-0');
                youtubeContainer.classList.remove('hidden');
                youtubeIframe.src = card.url;
            }

            renderCards();
        }

            const idToRemove = pendingRemoveCardId;
            const index = videoCards.findIndex(c => c.id === idToRemove);
            closeRemoveModal();

            if (index === -1) return;

            videoCards.splice(index, 1);
            saveCards();

        function renderCards() {
            cardsTrack.innerHTML = '';

            videoCards.forEach((card) => {
                const isActive = card.id === activeCardId;
                const liveHub = isLiveHubCard(card);
                const isGamesCard = card.theme === 'games' || card.id === 'card-3';
                const isRadioTvCard = card.theme === 'radio-tv' || card.id === 'card-2';
                const ytId = extractYouTubeId(card.url);
                const isHls = isHlsStream(card.url);
                const isRadioStream = isDirectAudioStream(card.url) || /xcast\.com\.br/i.test(card.url);
                const thumbUrl = (!isGamesCard && !isRadioTvCard && ytId) ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : null;
                const safeTitle = escapeHtml(card.title);

                let sourceLabel = 'Sinal Ambiente';
                if (isRadioTvCard) sourceLabel = 'Rádio & TV • YouTube, HLS & Outros';
                else if (isGamesCard) sourceLabel = 'Games Ao Vivo • YouTube, HLS & Outros';
                else if (liveHub) sourceLabel = 'Ao Vivo • YouTube, HLS & Outros';
                else if (ytId) sourceLabel = 'YouTube';
                else if (isHls) sourceLabel = 'Stream Ao Vivo • HLS';
                else if (isRadioStream) sourceLabel = 'Rádio Ao Vivo • A sua música toca aqui!';
                else if (card.url) sourceLabel = 'Vídeo Direto';

                const cardEl = document.createElement('div');
                cardEl.className = `group relative flex-shrink-0 w-44 sm:w-52 rounded-2xl p-2 transition-all duration-200 cursor-pointer backdrop-blur-md border ${
                    isActive
                        ? 'bg-white/20 border-red-500 shadow-[0_0_20px_rgba(225,29,43,0.4)] scale-[1.02]'
                        : 'bg-black/55 hover:bg-white/15 border-white/15 hover:border-white/30'
                }`;

                cardEl.onclick = () => playCard(card);

                const mediaPreviewHTML = isRadioTvCard
                    ? RADIO_TV_COVER_SVG
                    : (isGamesCard
                        ? BGAMES_COVER_SVG
                        : (thumbUrl
                            ? `<img src="${thumbUrl}" alt="${safeTitle}" onerror="this.style.display='none'" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300">`
                            : `<div class="w-full h-full bg-gradient-to-br from-[#7f1d1d] via-[#2a1c12] to-[#0b0f17] flex items-center justify-center"><span class="text-[10px] font-extrabold tracking-widest uppercase text-red-300/90">${liveHub ? 'RÁDIO & TV' : (isRadioStream ? 'AO VIVO' : 'PLAYER')}</span></div>`));

                cardEl.innerHTML = `
                    <div class="relative w-full h-12 sm:h-14 rounded-xl overflow-hidden bg-black/60 mb-1.5 flex items-center justify-center">
                        ${mediaPreviewHTML}
                        <div class="absolute inset-0 bg-black/25 group-hover:bg-black/10 transition"></div>
                        
                        <div class="absolute w-7 h-7 rounded-full flex items-center justify-center shadow-lg transition-transform group-hover:scale-110 ${
                            isActive ? 'bg-[#e11d2b] text-white' : 'bg-white/90 text-gray-900'
                        }">
                            <svg class="w-3.5 h-3.5 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>

                        ${isActive ? `<span class="absolute top-1 left-1 bg-[#e11d2b] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md tracking-wider uppercase">No Ar</span>` : ''}

                        <button type="button" title="Remover card (requer login do dono)" class="remove-card-btn opacity-80 sm:opacity-0 group-hover:opacity-100 absolute top-1 right-1 w-6 h-6 rounded-lg bg-black/75 hover:bg-red-600 text-white flex items-center justify-center transition cursor-pointer">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="px-0.5">
                        <p class="text-white text-xs font-semibold truncate leading-snug" title="${safeTitle}">
                            ${safeTitle}
                        </p>
                        <p class="text-white/55 text-[10px] truncate mt-0.5">
                            ${sourceLabel}
                        </p>
                    </div>
                `;

                const removeBtn = cardEl.querySelector('.remove-card-btn');
                removeBtn.addEventListener('click', (e) => requestRemoveCard(e, card.id));

                cardsTrack.appendChild(cardEl);
            });

            const quickAddCard = document.createElement('button');
            quickAddCard.type = 'button';
            quickAddCard.className = 'flex-shrink-0 w-28 sm:w-32 h-[84px] sm:h-[94px] rounded-2xl border border-dashed border-white/25 hover:border-white/60 bg-white/5 hover:bg-white/10 backdrop-blur-md flex flex-col items-center justify-center gap-1 text-white/75 hover:text-white transition cursor-pointer';
            quickAddCard.innerHTML = `
                <div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </div>
                <span class="text-[11px] font-semibold">Novo Card</span>
            `;
            quickAddCard.onclick = openModal;
            cardsTrack.appendChild(quickAddCard);
        }

        function openModal() {
            formErrorMsg.classList.add('hidden');
            ownerUserInput.value = '';
            ownerPassInput.value = '';
            cardTitleInput.value = '';
            cardUrlInput.value = '';
            addCardModal.classList.remove('hidden');
            addCardModal.scrollTop = 0;
            addCardModalBox.scrollTop = 0;
            setTimeout(() => {
                addCardModalBox.scrollTo({ top: 0, behavior: 'smooth' });
                ownerUserInput.focus();
            }, 50);
        }

        function closeModal() {
            addCardModal.classList.add('hidden');
        }

        openAddModalBtn.addEventListener('click', openModal);
        closeAddModalBtn.addEventListener('click', closeModal);
        cancelAddModalBtn.addEventListener('click', closeModal);

        addCardModal.addEventListener('click', (e) => {
            if (e.target === addCardModal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!addCardModal.classList.contains('hidden')) closeModal();
                if (!removeAuthModal.classList.contains('hidden')) closeRemoveModal();
            }
        });

        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = ownerUserInput.value.trim();
            const password = ownerPassInput.value;
            const title = cardTitleInput.value.trim();
            const url = cardUrlInput.value.trim();

            if (!hasOwnerAccess(username, password)) {
                formErrorMsg.textContent = 'Usuário ou senha do dono incorretos.';
                formErrorMsg.classList.remove('hidden');
                return;
            }

            if (!title || !url) {
                formErrorMsg.textContent = 'Preencha o título e a URL válida do vídeo.';
                formErrorMsg.classList.remove('hidden');
                return;
            }

            if (!isSafeHttpUrl(url)) {
                formErrorMsg.textContent = 'Insira um link HTTP ou HTTPS válido (ex: https://...).';
                formErrorMsg.classList.remove('hidden');
                return;
            }

            const newCard = {
                id: 'card-' + Date.now(),
                title,
                url
            };

            videoCards.push(newCard);
            saveCards();
            closeModal();
            playCard(newCard);
            showToast('Card adicionado e reproduzindo!');

            setTimeout(() => {
                cardsTrack.scrollTo({ left: cardsTrack.scrollWidth, behavior: 'smooth' });
            }, 100);
        });

        loadState();
        loadCards();
        renderCards();
        const initialCard = videoCards.find(c => c.id === activeCardId) || videoCards[0];
        playCard(initialCard);
    </script>
</body>
</html>
