<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reprodutor de Vídeos Ao Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Proporção exata ~16:8.5 baseada na imagem de referência com bordas arredondadas */
        .player-aspect-box {
            aspect-ratio: 16 / 8.5;
            width: 100%;
            max-width: 1000px;
            max-height: 92vh;
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
            transition: border-radius 0.3s ease;
        }

        /* Ajustes quando o container principal estiver em Tela Cheia */
        .player-aspect-box:fullscreen {
            max-width: 100vw !important;
            max-height: 100vh !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }
        .player-aspect-box:-webkit-full-screen {
            max-width: 100vw !important;
            max-height: 100vh !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }

        /* Estilização discreta para a barra de rolagem horizontal dos cards */
        .cards-scroller::-webkit-scrollbar {
            height: 5px;
        }
        .cards-scroller::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
        }
        .cards-scroller::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
        }
        .cards-scroller::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.45);
        }

        /* Efeito de brilho ambiente quente centralizado idêntico à imagem de referência */
        .ambient-backdrop {
            background: radial-gradient(circle at 50% 42%, rgba(196, 128, 56, 0.52) 0%, rgba(112, 66, 28, 0.32) 34%, rgba(10, 16, 24, 0.96) 72%, #070b10 100%);
        }

        /* Transição suave ao ocultar/exibir a interface sobreposta */
        .hud-layer {
            transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1), transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hud-hidden-top {
            opacity: 0 !important;
            transform: translateY(-14px);
            pointer-events: none !important;
        }
        .hud-hidden-bottom {
            opacity: 0 !important;
            transform: translateY(18px);
            pointer-events: none !important;
        }
        .hud-hidden-fade {
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-3 sm:p-6 select-none">

    <!-- Container Principal Único: Reprodutor de Vídeos -->
    <div id="mainPlayerContainer" class="player-aspect-box relative overflow-hidden bg-[#070b10] flex flex-col justify-between">
        
        <!-- Camada de Fundo Desfocado (Fiel à imagem de referência) -->
        <div id="ambientFallback" class="ambient-backdrop absolute inset-0 z-0 transition-opacity duration-500">
            <div class="absolute inset-0 backdrop-blur-3xl opacity-90"></div>
        </div>

        <!-- Camada de Vídeo Nativo (MP4 / WebM) -->
        <video id="nativeVideoPlayer" class="hidden absolute inset-0 w-full h-full object-cover z-0" playsinline controls></video>

        <!-- Camada de Vídeo YouTube (Iframe) -->
        <div id="youtubeContainer" class="hidden absolute inset-0 w-full h-full z-0 bg-black">
            <iframe id="youtubeIframe" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- Camada Transparente de Interceptação (Ativa apenas quando a interface está oculta: restaura tudo ao tocar/clicar sem pausar o vídeo) -->
        <div id="restoreUiOverlay" class="hidden absolute inset-0 z-30 cursor-pointer bg-transparent" title="Toque ou clique para mostrar os controles"></div>

        <!-- Gradiente sutil superior e inferior para garantir leitura dos controles e cards sobrepostos -->
        <div id="topGradient" class="hud-layer pointer-events-none absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/65 via-black/25 to-transparent z-10"></div>
        <div id="bottomGradient" class="hud-layer pointer-events-none absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/90 via-black/50 to-transparent z-10"></div>

        <!-- Barra Superior Interna: Selo 'AO VIVO' à esquerda e Ações (Adicionar, Ocultar, PiP, Tela Cheia) à direita -->
        <div id="topHudBar" class="hud-layer relative z-20 flex items-center justify-between gap-2 px-4 pt-4 sm:px-7 sm:pt-6">
            <!-- Selo Vermelho AO VIVO idêntico à referência -->
            <div class="inline-flex items-center gap-2 bg-[#e11d2b] text-white font-extrabold tracking-wider text-xs sm:text-sm px-3.5 py-2 sm:px-5 sm:py-2.5 rounded-2xl shadow-lg flex-shrink-0">
                <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white animate-pulse"></span>
                <span>AO VIVO</span>
            </div>

            <!-- Título do Vídeo Atual (Discreto no centro em telas maiores) -->
            <div id="nowPlayingBadge" class="hidden lg:flex items-center gap-2 px-4 py-1.5 rounded-full bg-black/45 backdrop-blur-md border border-white/10 text-white/90 text-xs font-medium max-w-xs truncate">
                <span class="text-white/50">Reproduzindo:</span>
                <span id="nowPlayingTitle" class="truncate font-semibold text-white">Sinal Principal • Ambiente</span>
            </div>

            <!-- Grupo de Controles Superiores Direitos -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Botão Adicionar Novo Card -->
                <button id="openAddModalBtn" type="button" title="Adicionar novo card de vídeo" class="inline-flex items-center gap-1.5 bg-white/15 hover:bg-white/25 active:scale-95 text-white text-xs sm:text-sm font-semibold px-3 py-2 sm:px-3.5 sm:py-2.5 rounded-xl sm:rounded-2xl backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="hidden sm:inline">Adicionar Card</span>
                </button>

                <!-- 1) Botão Ocultar Interface (Limpar Tela / Olho Fechado) -->
                <button id="hideUiBtn" type="button" title="Ocultar interface (Modo Cinema)" aria-label="Ocultar interface" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <!-- Ícone Olho Cortado (Ocultar) -->
                    <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                </button>

                <!-- 2) Botão Picture-in-Picture (PiP) -->
                <button id="pipBtn" type="button" title="Picture-in-Picture (Janela Flutuante)" aria-label="Picture-in-Picture" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <svg class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="14" rx="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="11" y="10" width="8" height="6" rx="1.2" fill="currentColor" stroke="none"/>
                    </svg>
                </button>

                <!-- 3) Botão Tela Cheia (Fullscreen) -->
                <button id="fullscreenBtn" type="button" title="Tela Cheia" aria-label="Tela Cheia" class="p-2 sm:p-2.5 rounded-xl sm:rounded-2xl bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-md border border-white/15 transition-all cursor-pointer shadow-md">
                    <!-- Ícone Expandir Tela Cheia -->
                    <svg id="fullscreenExpandIcon" class="w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                    </svg>
                    <!-- Ícone Sair da Tela Cheia -->
                    <svg id="fullscreenCompressIcon" class="hidden w-4 h-4 sm:w-[18px] sm:h-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Faixa Horizontal Rolável de Cards na Parte Inferior Interna -->
        <div id="bottomHudBar" class="hud-layer relative z-20 px-4 pb-4 sm:px-7 sm:pb-6 w-full">
            <div id="cardsTrack" class="cards-scroller flex items-center gap-3 sm:gap-4 overflow-x-auto pb-1.5 pt-1">
                <!-- Os cards são renderizados dinamicamente via JavaScript -->
            </div>
        </div>

        <!-- Overlay / Modal Interno Compacto para Adicionar Novo Card -->
        <div id="addCardModal" class="hidden absolute inset-0 z-40 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 transition-opacity">
            <div class="w-full max-w-md bg-[#121721]/95 border border-white/15 rounded-3xl p-5 sm:p-6 shadow-2xl text-white">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base sm:text-lg font-bold tracking-tight">Adicionar Novo Card</h2>
                    <button id="closeAddModalBtn" type="button" class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition cursor-pointer" title="Fechar">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <form id="addCardForm" class="space-y-3.5">
                    <div>
                        <label for="cardTitleInput" class="block text-xs font-semibold text-white/75 mb-1">Título do Vídeo</label>
                        <input id="cardTitleInput" type="text" required placeholder="Ex: Câmera 02 - Palco Principal" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <div>
                        <label for="cardUrlInput" class="block text-xs font-semibold text-white/75 mb-1">Link da URL (MP4, WebM ou YouTube)</label>
                        <input id="cardUrlInput" type="url" required placeholder="https://www.youtube.com/watch?v=... ou .mp4" class="w-full bg-white/10 border border-white/15 focus:border-red-500 focus:outline-none rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-white/40 transition">
                    </div>

                    <p id="formErrorMsg" class="hidden text-xs text-red-400 font-medium"></p>

                    <div class="flex items-center justify-end gap-2.5 pt-2">
                        <button type="button" id="cancelAddModalBtn" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-white/10 hover:bg-white/20 text-white/85 transition cursor-pointer">
                            Cancelar
                        </button>
                        <button type="submit" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-[#e11d2b] hover:bg-[#c81724] text-white shadow-lg transition cursor-pointer">
                            Salvar Card
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notificação interna discreta -->
        <div id="toastNotification" class="hidden absolute top-16 sm:top-20 left-1/2 -translate-x-1/2 z-50 bg-black/85 border border-white/15 text-white text-xs font-medium px-4 py-2 rounded-full shadow-xl backdrop-blur-md text-center max-w-[90%]"></div>
    </div>

    <script>
        // Estado inicial com vídeos de exemplo funcionais (MP4 públicos e YouTube)
        const STORAGE_KEY = 'live_player_video_cards_v1';

        const defaultCards = [
            {
                id: 'card-1',
                title: 'Tv Padre Cicero',
                url: 'https://video01.logicahost.com.br/tvpadrecicero/tvpadrecicero/playlist.m3u8', 
            },
            {
                id: 'card-2',
                title: 'Canal Uol',
                url: 'https://video24.mais.uol.com.br/live/6146.m3u8'
            },
            {
                id: 'card-3',
                title: 'VejaTv',
                url: 'https://gpa-vja.otteravision.com/gpa/vja/vja.m3u8'
            },
            {
                id: 'card-4',
                title: 'Fifa +',
                url: 'https://e3be9ac5.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/TEctYnJfRklGQVBsdXNQb3J0dWd1ZXNlX0hMUw/playlist.m3u8'
            }
        ];

        let videoCards = [];
        let activeCardId = 'card-1';
        let isUiHidden = false;

        // Referências do DOM
        const mainPlayerContainer = document.getElementById('mainPlayerContainer');
        const cardsTrack = document.getElementById('cardsTrack');
        const ambientFallback = document.getElementById('ambientFallback');
        const nativeVideoPlayer = document.getElementById('nativeVideoPlayer');
        const youtubeContainer = document.getElementById('youtubeContainer');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');

        // Referências da Interface Sobreposta (HUD) e Novos Botões
        const topHudBar = document.getElementById('topHudBar');
        const bottomHudBar = document.getElementById('bottomHudBar');
        const topGradient = document.getElementById('topGradient');
        const bottomGradient = document.getElementById('bottomGradient');
        const restoreUiOverlay = document.getElementById('restoreUiOverlay');

        const hideUiBtn = document.getElementById('hideUiBtn');
        const pipBtn = document.getElementById('pipBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenExpandIcon = document.getElementById('fullscreenExpandIcon');
        const fullscreenCompressIcon = document.getElementById('fullscreenCompressIcon');

        // Referências do Modal
        const addCardModal = document.getElementById('addCardModal');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const closeAddModalBtn = document.getElementById('closeAddModalBtn');
        const cancelAddModalBtn = document.getElementById('cancelAddModalBtn');
        const addCardForm = document.getElementById('addCardForm');
        const cardTitleInput = document.getElementById('cardTitleInput');
        const cardUrlInput = document.getElementById('cardUrlInput');
        const formErrorMsg = document.getElementById('formErrorMsg');
        const toastNotification = document.getElementById('toastNotification');

        // Carrega cards salvos ou usa os padrões
        function loadCards() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        videoCards = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.warn('Falha ao ler localStorage:', e);
            }
            videoCards = [...defaultCards];
        }

        function saveCards() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(videoCards));
            } catch (e) {
                console.warn('Falha ao salvar no localStorage:', e);
            }
        }

        // Extrai ID do YouTube se a URL for do YouTube
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        // Exibe aviso rápido dentro do próprio reprodutor
        let toastTimeout;
        function showToast(message) {
            toastNotification.textContent = message;
            toastNotification.classList.remove('hidden');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastNotification.classList.add('hidden');
            }, 3000);
        }

        // =========================================================================
        // 1) OCULTAR / RESTAURAR INTERFACE (MODO TELA LIMPA)
        // =========================================================================
        function hideInterface() {
            if (isUiHidden) return;
            isUiHidden = true;

            topHudBar.classList.add('hud-hidden-top');
            bottomHudBar.classList.add('hud-hidden-bottom');
            topGradient.classList.add('hud-hidden-fade');
            bottomGradient.classList.add('hud-hidden-fade');

            // Ativa camada transparente que intercepta o próximo toque/clique sem pausar o vídeo
            restoreUiOverlay.classList.remove('hidden');
            showToast('Interface oculta. Toque na tela para reexibir.');
        }

        function restoreInterface(event) {
            if (!isUiHidden) return;
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            isUiHidden = false;

            topHudBar.classList.remove('hud-hidden-top');
            bottomHudBar.classList.remove('hud-hidden-bottom');
            topGradient.classList.remove('hud-hidden-fade');
            bottomGradient.classList.remove('hud-hidden-fade');

            restoreUiOverlay.classList.add('hidden');
        }

        hideUiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideInterface();
        });

        // Suporte imediato tanto para toque mobile (touchend) quanto clique desktop (click)
        restoreUiOverlay.addEventListener('touchend', restoreInterface, { passive: false });
        restoreUiOverlay.addEventListener('click', restoreInterface);

        // =========================================================================
        // 2) PICTURE-IN-PICTURE (PiP)
        // =========================================================================
        async function togglePictureInPicture() {
            const isNativeVideoVisible = !nativeVideoPlayer.classList.contains('hidden');
            const isYouTubeVisible = !youtubeContainer.classList.contains('hidden');

            if (isYouTubeVisible) {
                showToast('O Picture-in-Picture nativo está disponível apenas para vídeos diretos (MP4/WebM).');
                return;
            }

            if (!isNativeVideoVisible || !nativeVideoPlayer.src) {
                showToast('Selecione um vídeo direto (MP4/WebM) para ativar o Picture-in-Picture.');
                return;
            }

            if (!document.pictureInPictureEnabled && !nativeVideoPlayer.webkitSetPresentationMode) {
                showToast('Seu navegador não suporta Picture-in-Picture.');
                return;
            }

            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (nativeVideoPlayer.requestPictureInPicture) {
                    await nativeVideoPlayer.requestPictureInPicture();
                } else if (nativeVideoPlayer.webkitSetPresentationMode) {
                    // Fallback Safari iOS/macOS
                    const mode = nativeVideoPlayer.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
                    nativeVideoPlayer.webkitSetPresentationMode(mode);
                }
            } catch (err) {
                console.warn('Erro ao alternar PiP:', err);
                showToast('Inicie a reprodução do vídeo antes de ativar o Picture-in-Picture.');
            }
        }

        pipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePictureInPicture();
        });

        nativeVideoPlayer.addEventListener('enterpictureinpicture', () => {
            pipBtn.classList.add('bg-[#e11d2b]', 'border-red-400');
            pipBtn.classList.remove('bg-white/15');
        });

        nativeVideoPlayer.addEventListener('leavepictureinpicture', () => {
            pipBtn.classList.remove('bg-[#e11d2b]', 'border-red-400');
            pipBtn.classList.add('bg-white/15');
        });

        // =========================================================================
        // 3) TELA CHEIA (FULLSCREEN) DO CONTAINER PRINCIPAL
        // =========================================================================
        function updateFullscreenIcons() {
            const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            if (isFs) {
                fullscreenExpandIcon.classList.add('hidden');
                fullscreenCompressIcon.classList.remove('hidden');
                fullscreenBtn.title = 'Sair da Tela Cheia';
            } else {
                fullscreenExpandIcon.classList.remove('hidden');
                fullscreenCompressIcon.classList.add('hidden');
                fullscreenBtn.title = 'Tela Cheia';
            }
        }

        async function toggleFullscreen() {
            const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            try {
                if (!isFs) {
                    if (mainPlayerContainer.requestFullscreen) {
                        await mainPlayerContainer.requestFullscreen();
                    } else if (mainPlayerContainer.webkitRequestFullscreen) {
                        await mainPlayerContainer.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }
                }
            } catch (err) {
                console.warn('Erro ao alternar tela cheia:', err);
                showToast('Não foi possível ativar a tela cheia neste ambiente.');
            }
        }

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

        // =========================================================================
        // REPRODUÇÃO E GERENCIAMENTO DOS CARDS
        // =========================================================================
        function playCard(card) {
            activeCardId = card.id;
            nowPlayingTitle.textContent = card.title;

            // Encerra PiP ativo se trocar para YouTube ou Sinal Ambiente
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            }

            // Pausa e limpa players anteriores
            nativeVideoPlayer.pause();
            nativeVideoPlayer.removeAttribute('src');
            nativeVideoPlayer.load();
            nativeVideoPlayer.classList.add('hidden');

            youtubeIframe.src = '';
            youtubeContainer.classList.add('hidden');

            if (!card.url || card.isAmbientDefault) {
                ambientFallback.classList.remove('opacity-0');
                renderCards();
                return;
            }

            const ytId = extractYouTubeId(card.url);

            if (ytId) {
                ambientFallback.classList.add('opacity-0');
                youtubeContainer.classList.remove('hidden');
                youtubeIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
            } else {
                ambientFallback.classList.add('opacity-0');
                nativeVideoPlayer.classList.remove('hidden');
                nativeVideoPlayer.src = card.url;
                nativeVideoPlayer.play().catch(() => {
                    showToast('Clique no vídeo para iniciar a reprodução.');
                });
            }

            renderCards();
        }

        function removeCard(event, id) {
            event.stopPropagation();
            if (videoCards.length <= 1) {
                showToast('Mantenha pelo menos 1 card no reprodutor.');
                return;
            }

            const index = videoCards.findIndex(c => c.id === id);
            if (index === -1) return;

            videoCards.splice(index, 1);
            saveCards();

            if (activeCardId === id) {
                playCard(videoCards[0]);
            } else {
                renderCards();
            }
            showToast('Card removido.');
        }

        function renderCards() {
            cardsTrack.innerHTML = '';

            videoCards.forEach((card) => {
                const isActive = card.id === activeCardId;
                const ytId = extractYouTubeId(card.url);
                const thumbUrl = ytId ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg` : null;

                const cardEl = document.createElement('div');
                cardEl.className = `group relative flex-shrink-0 w-44 sm:w-52 rounded-2xl p-2.5 transition-all duration-200 cursor-pointer backdrop-blur-md border ${
                    isActive
                        ? 'bg-white/20 border-red-500 shadow-[0_0_20px_rgba(225,29,43,0.4)] scale-[1.02]'
                        : 'bg-black/55 hover:bg-white/15 border-white/15 hover:border-white/30'
                }`;

                cardEl.onclick = () => playCard(card);

                const mediaPreviewHTML = thumbUrl
                    ? `<img src="${thumbUrl}" alt="${card.title}" onerror="this.style.display='none'" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300">`
                    : `<div class="w-full h-full bg-gradient-to-br from-[#2a1c12] via-[#161e29] to-[#0b0f17]"></div>`;

                cardEl.innerHTML = `
                    <div class="relative w-full h-16 sm:h-20 rounded-xl overflow-hidden bg-black/60 mb-2 flex items-center justify-center">
                        ${mediaPreviewHTML}
                        <div class="absolute inset-0 bg-black/25 group-hover:bg-black/10 transition"></div>
                        
                        <!-- Ícone Central de Play -->
                        <div class="absolute w-8 h-8 sm:w-9 sm:h-9 rounded-full flex items-center justify-center shadow-lg transition-transform group-hover:scale-110 ${
                            isActive ? 'bg-[#e11d2b] text-white' : 'bg-white/90 text-gray-900'
                        }">
                            <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>

                        <!-- Indicador de Tocando Agora -->
                        ${isActive ? `<span class="absolute top-1.5 left-1.5 bg-[#e11d2b] text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md tracking-wider uppercase">No Ar</span>` : ''}

                        <!-- Botão Discreto de Remover Card -->
                        <button type="button" title="Remover card" class="remove-card-btn opacity-80 sm:opacity-0 group-hover:opacity-100 absolute top-1.5 right-1.5 w-6 h-6 rounded-lg bg-black/75 hover:bg-red-600 text-white flex items-center justify-center transition cursor-pointer">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="px-0.5">
                        <p class="text-white text-xs sm:text-[13px] font-semibold truncate leading-snug" title="${card.title}">
                            ${card.title}
                        </p>
                        <p class="text-white/55 text-[10px] truncate mt-0.5">
                            ${ytId ? 'YouTube' : (card.url ? 'Vídeo Direto' : 'Sinal Ambiente')}
                        </p>
                    </div>
                `;

                const removeBtn = cardEl.querySelector('.remove-card-btn');
                removeBtn.addEventListener('click', (e) => removeCard(e, card.id));

                cardsTrack.appendChild(cardEl);
            });

            // Card rápido "+ Novo" no final da fila horizontal
            const quickAddCard = document.createElement('button');
            quickAddCard.type = 'button';
            quickAddCard.className = 'flex-shrink-0 w-28 sm:w-32 h-[106px] sm:h-[124px] rounded-2xl border border-dashed border-white/25 hover:border-white/60 bg-white/5 hover:bg-white/10 backdrop-blur-md flex flex-col items-center justify-center gap-1.5 text-white/75 hover:text-white transition cursor-pointer';
            quickAddCard.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                </div>
                <span class="text-[11px] font-semibold">Novo Card</span>
            `;
            quickAddCard.onclick = openModal;
            cardsTrack.appendChild(quickAddCard);
        }

        // Controles do Modal Interno
        function openModal() {
            formErrorMsg.classList.add('hidden');
            cardTitleInput.value = '';
            cardUrlInput.value = '';
            addCardModal.classList.remove('hidden');
            setTimeout(() => cardTitleInput.focus(), 50);
        }

        function closeModal() {
            addCardModal.classList.add('hidden');
        }

        openAddModalBtn.addEventListener('click', openModal);
        closeAddModalBtn.addEventListener('click', closeModal);
        cancelAddModalBtn.addEventListener('click', closeModal);

        addCardModal.addEventListener('click', (e) => {
            if (e.target === addCardModal) closeModal();
        });

        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = cardTitleInput.value.trim();
            const url = cardUrlInput.value.trim();

            if (!title || !url) {
                formErrorMsg.textContent = 'Preencha o título e a URL válida do vídeo.';
                formErrorMsg.classList.remove('hidden');
                return;
            }

            try {
                new URL(url);
            } catch (_) {
                formErrorMsg.textContent = 'Insira um link de URL válido (ex: https://...).';
                formErrorMsg.classList.remove('hidden');
                return;
            }

            const newCard = {
                id: 'card-' + Date.now(),
                title,
                url
            };

            videoCards.push(newCard);
            saveCards();
            closeModal();
            playCard(newCard);
            showToast('Card adicionado e reproduzindo!');

            setTimeout(() => {
                cardsTrack.scrollTo({ left: cardsTrack.scrollWidth, behavior: 'smooth' });
            }, 100);
        });

        // Inicialização
        loadCards();
        playCard(videoCards[0]);
    </script>
</body>
</html>
